name: build-and-test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: Linux, configuration: Debug}
          - {os: ubuntu-latest, platform: Linux, configuration: Release}
          - {os: macos-latest, platform: MacOS, configuration: Debug}
          - {os: macos-latest, platform: MacOS, configuration: Release}
          - {os: windows-latest, platform: Windows, configuration: Debug}
          - {os: windows-latest, platform: Windows, configuration: Release}
          - {os: windows-latest, platform: Windows, configuration: Release, jit: 'ON'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          cmake --preset "${{ matrix.platform }} ${{ matrix.configuration }}" -DCIAL_ENABLE_JIT=${{ matrix.jit || 'OFF' }}
      - name: Build tests
        run: cmake --build build/${{ matrix.platform }}/${{ matrix.configuration }} --target cial CiallangTests --parallel 4
      - name: Test
        run: ctest --test-dir build/${{ matrix.platform }}/${{ matrix.configuration }} --output-on-failure
      - name: Save build and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.configuration }}-jit-${{ matrix.jit || 'OFF' }}
          path: |
            build/${{ matrix.platform }}/${{ matrix.configuration }}/Testing/Temporary/
            build/${{ matrix.platform }}/${{ matrix.configuration }}/cial
            build/${{ matrix.platform }}/${{ matrix.configuration }}/cial.exe
          if-no-files-found: ignore
      - name: Configure library consumer
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Release'
        shell: bash
        run: |
          cmake -S tests/embedding -B build/embedding -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DVCPKG_INSTALLED_DIR="$PWD/build/Linux/Release/vcpkg_installed"
          cmake --build build/embedding --parallel 4
          ctest --test-dir build/embedding --output-on-failure
